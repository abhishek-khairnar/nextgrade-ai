services:
  - type: web
    name: nextgrade-ai-backend
    env: python
    runtime: python-3.11.9
    plan: free
    region: oregon
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DATABASE_URL
        value: "sqlite:///./nextgrade.db"
